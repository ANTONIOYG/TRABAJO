<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Clock Circle -->
  <g filter="url(#shadow)" transform="translate(56, 56)">
    <circle cx="200" cy="200" r="160" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="18"/>
    <!-- Clock center dot -->
    <circle cx="200" cy="200" r="14" fill="#38bdf8" />
    <!-- Clock Hands -->
    <line x1="200" y1="200" x2="200" y2="100" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="270" y2="200" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Clock Tick marks -->
    <circle cx="200" cy="65" r="6" fill="#818cf8" />
    <circle cx="335" cy="200" r="6" fill="#818cf8" />
    <circle cx="200" cy="335" r="6" fill="#818cf8" />
    <circle cx="65" cy="200" r="6" fill="#818cf8" />
  </g>
</svg>
