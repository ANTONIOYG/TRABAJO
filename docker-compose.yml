services:
  # ----------------------------------------------------------------------------
  # Servicio de Base de Datos MySQL
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: worklog-pro-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-worklog_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-worklog_pro}
      MYSQL_USER: ${MYSQL_USER:-worklog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-worklog_password}
    ports:
      # Expone el puerto 3307 en el host (para evitar conflictos si tienes MySQL local en el 3306)
      - "${MYSQL_PORT_EXPOSED:-3307}:3306"
    volumes:
      # Persistencia de datos de MySQL
      - mysql_data:/var/lib/mysql
      # Inicialización automática de esquema y tablas al arrancar por primera vez
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - worklog_network

  # ----------------------------------------------------------------------------
  # Aplicación Web WorkLog Pro (Express API + Frontend React en producción)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worklog-pro-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      # Conexión interna con el contenedor MySQL
      MYSQL_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-worklog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-worklog_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-worklog_pro}
      MYSQL_SSL: "false"
      # Configuración SMTP opcional para envío de correos
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-antonioyg@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      DEFAULT_RECIPIENT_EMAIL: ${DEFAULT_RECIPIENT_EMAIL:-antonioyg@gmail.com}
      # WhatsApp Twilio opcional
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      WHATSAPP_TO_NUMBER: ${WHATSAPP_TO_NUMBER:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - worklog_network

# ------------------------------------------------------------------------------
# Volúmenes persistentes
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: worklog_mysql_data

# ------------------------------------------------------------------------------
# Red de contenedores aislada
# ------------------------------------------------------------------------------
networks:
  worklog_network:
    name: worklog_network
    driver: bridge
